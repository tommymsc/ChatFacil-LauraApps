plugins { id 'com.android.application' }
def realAds = providers.gradleProperty('enableRealAds').orElse('false').get().toBoolean()
def appAdId = providers.gradleProperty('adMobAppId').orElse('').get()
def bannerAdId = providers.gradleProperty('adMobBannerId').orElse('').get()
def validReal = realAds && appAdId ==~ /ca-app-pub-\d{16}~\d{10}/ && bannerAdId ==~ /ca-app-pub-\d{16}\/\d{10}/
if (realAds && !validReal) throw new GradleException('IDs reales AdMob inválidos')
android {
    namespace 'com.lauraapps.chatfacil'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lauraapps.chatfacil'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        manifestPlaceholders = [adMobAppId: validReal ? appAdId : 'ca-app-pub-3940256099942544~3347511713']
        buildConfigField 'boolean', 'REAL_ADS', validReal.toString()
        buildConfigField 'String', 'BANNER_ID', '"' + (validReal ? bannerAdId : 'ca-app-pub-3940256099942544/6300978111') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
gradle.taskGraph.whenReady { graph ->
    if(graph.allTasks.any { it.name in ['assembleRelease','bundleRelease'] } && !validReal)
        throw new GradleException('Release bloqueada: crea primero la app en AdMob y configura IDs reales')
}
