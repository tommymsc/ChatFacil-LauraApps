name: Build Chat Facil Production AAB
on:
  push:
    branches:
      - feature/admob-chat-facil-real-ids
    paths:
      - '.github/workflows/android-release-aab.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:
jobs:
  release-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' || test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/brand/icon-96.webp.base64 > app/src/main/res/drawable-nodpi/launcher.webp
      - name: Test and compile production bundle with real AdMob IDs
        run: gradle --no-daemon :app:testDebugUnitTest :app:bundleRelease -PenableRealAds=true --stacktrace
      - name: Upload unsigned bundle for secure offline signing
        uses: actions/upload-artifact@v4
        with:
          name: ChatFacil-release-unsigned-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
